[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kyber-observe"
version = "0.1.0"
description = "Analysis dashboard and telemetry tools for coding-agent sessions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer",
]

[project.scripts]
kyber-observe = "kyber_observe.cli:main"

[tool.setuptools.packages.find]
include = ["agentdash*", "kyber_observe*"]
